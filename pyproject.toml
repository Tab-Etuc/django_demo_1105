[project]
name = "django-demo-1027"
version = "0.1.0"
requires-python = ">=3.14.3,<3.15"
dependencies = [
    "django==6.1.2",
]

[dependency-groups]
dev = [
    "django-stubs==6.1.2",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
